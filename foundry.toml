[profile.default]
src            = "src"
script         = "script"
out            = "out"
libs           = ["lib"]
evm_version    = "paris"
solc_version   = "0.8.25"
optimizer      = true
optimizer_runs = 200
via_ir         = true

remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
  "forge-std/=lib/openzeppelin-contracts/lib/forge-std/src/",
]

[profile.script]
src            = "src"
script         = "script"
out            = "out"
libs           = ["lib"]
evm_version    = "paris"
solc_version   = "0.8.25"
optimizer      = true
optimizer_runs = 200
via_ir         = true

remappings = [
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
  "forge-std/=lib/openzeppelin-contracts/lib/forge-std/src/",
]

[rpc_endpoints]
hedera_testnet = "https://testnet.hashio.io/api"
hedera_mainnet = "https://mainnet.hashio.io/api"
base = "${BASE_RPC_URL}"
robinhood = "${ROBINHOOD_RPC_URL}"
