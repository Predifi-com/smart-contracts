[profile.default]
src = "contracts"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
cache_path = "cache"
broadcast = "broadcast"

# Solidity compiler settings
solc_version = "0.8.25"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true

# Test settings
fuzz = { runs = 1000 }
invariant = { runs = 100, depth = 100 }

# Gas reporting
gas_reports = ["*"]
gas_reports_ignore = ["test/**/*"]

# Formatter settings
line_length = 100
tab_width = 4
bracket_spacing = true

# Remappings
remappings = [
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
    "forge-std/=lib/forge-std/src/",
    "solmate/=lib/solmate/src/"
]

# RPC URLs for deployment
[rpc_endpoints]
mainnet = "${MAINNET_RPC_URL}"
goerli = "${GOERLI_RPC_URL}"
sepolia = "${SEPOLIA_RPC_URL}"
base = "${BASE_RPC_URL}"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
polygon = "${POLYGON_RPC_URL}"
polygon_amoy = "${POLYGON_AMOY_RPC_URL}"
optimism = "${OPTIMISM_RPC_URL}"
optimism_sepolia = "${OP_SEPOLIA_RPC_URL}"

# Etherscan API key
etherscan_api_key = "${ETHERSCAN_API_KEY}"

[profile.coverage]
src = "contracts/contracts"
test = "test/unit"
out = "out-coverage"
libs = ["lib"]
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"
coverage = { exclude = ["src/predifi/**"] }